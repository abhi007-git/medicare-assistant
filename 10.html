<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Queue List Skeleton</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display overflow-x-hidden antialiased selection:bg-primary/30 selection:text-white">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-dark text-white max-w-md mx-auto shadow-2xl overflow-hidden border-x border-[#192433]">
<!-- Header Skeleton -->
<header class="flex items-center justify-between p-4 pb-2 bg-background-dark sticky top-0 z-20">
<!-- Back Button Placeholder -->
<div class="h-10 w-10 rounded-full bg-[#1e293b] animate-pulse shrink-0"></div>
<!-- Title Placeholder -->
<div class="h-6 w-40 bg-[#1e293b] rounded animate-pulse"></div>
<!-- Profile/Menu Button Placeholder -->
<div class="h-10 w-10 rounded-full bg-[#1e293b] animate-pulse shrink-0"></div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full">
<!-- Hero Card Skeleton (Now Serving) -->
<div class="px-4 py-4 w-full">
<div class="relative w-full overflow-hidden rounded-xl bg-[#192433] p-5 shadow-lg border border-[#233348]/50">
<!-- Status Label -->
<div class="h-4 w-24 bg-[#2b3b4f] rounded mb-6 animate-pulse"></div>
<!-- Main Ticket Number -->
<div class="flex items-center gap-4 mb-6">
<div class="h-16 w-16 rounded-lg bg-[#2b3b4f] animate-pulse"></div> <!-- Icon or Letter representation -->
<div class="h-14 w-32 bg-[#2b3b4f] rounded animate-pulse"></div> <!-- Number -->
</div>
<!-- Footer of Card -->
<div class="flex items-end justify-between mt-2 pt-4 border-t border-[#233348]">
<div class="flex flex-col gap-2">
<div class="h-3 w-20 bg-[#2b3b4f] rounded animate-pulse"></div>
<div class="h-4 w-28 bg-[#2b3b4f] rounded animate-pulse"></div>
</div>
<!-- Action Button Skeleton -->
<div class="h-9 w-24 rounded-lg bg-[#2b3b4f] animate-pulse"></div>
</div>
</div>
</div>
<!-- Tabs / Segmented Control Skeleton -->
<div class="px-4 py-2 w-full">
<div class="flex h-12 w-full items-center rounded-xl bg-[#192433] p-1">
<div class="h-full flex-1 rounded-lg bg-[#2b3b4f] shadow-sm animate-pulse m-0.5"></div>
<div class="h-full flex-1 rounded-lg bg-transparent m-0.5 flex items-center justify-center">
<div class="h-4 w-20 bg-[#233348] rounded animate-pulse"></div>
</div>
</div>
</div>
<!-- List Header -->
<div class="px-4 pt-6 pb-2 flex justify-between items-end">
<div class="h-5 w-32 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-4 w-16 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<!-- List Items Skeleton -->
<div class="flex flex-col w-full pb-24">
<!-- Skeleton Item 1 -->
<div class="flex items-center gap-4 px-4 py-4 border-b border-[#1e293b]/50">
<!-- Avatar/Icon -->
<div class="h-12 w-12 shrink-0 rounded-full bg-[#1e293b] animate-pulse"></div>
<!-- Content -->
<div class="flex flex-col gap-2 flex-1">
<div class="h-4 w-3/4 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-3 w-1/2 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<!-- Status/Time -->
<div class="h-8 w-16 rounded-lg bg-[#1e293b] animate-pulse shrink-0"></div>
</div>
<!-- Skeleton Item 2 -->
<div class="flex items-center gap-4 px-4 py-4 border-b border-[#1e293b]/50">
<div class="h-12 w-12 shrink-0 rounded-full bg-[#1e293b] animate-pulse"></div>
<div class="flex flex-col gap-2 flex-1">
<div class="h-4 w-2/3 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-3 w-1/3 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<div class="h-8 w-16 rounded-lg bg-[#1e293b] animate-pulse shrink-0"></div>
</div>
<!-- Skeleton Item 3 -->
<div class="flex items-center gap-4 px-4 py-4 border-b border-[#1e293b]/50">
<div class="h-12 w-12 shrink-0 rounded-full bg-[#1e293b] animate-pulse"></div>
<div class="flex flex-col gap-2 flex-1">
<div class="h-4 w-3/5 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-3 w-1/2 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<div class="h-8 w-16 rounded-lg bg-[#1e293b] animate-pulse shrink-0"></div>
</div>
<!-- Skeleton Item 4 -->
<div class="flex items-center gap-4 px-4 py-4 border-b border-[#1e293b]/50">
<div class="h-12 w-12 shrink-0 rounded-full bg-[#1e293b] animate-pulse"></div>
<div class="flex flex-col gap-2 flex-1">
<div class="h-4 w-4/5 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-3 w-1/3 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<div class="h-8 w-16 rounded-lg bg-[#1e293b] animate-pulse shrink-0"></div>
</div>
<!-- Skeleton Item 5 -->
<div class="flex items-center gap-4 px-4 py-4 border-b border-[#1e293b]/50">
<div class="h-12 w-12 shrink-0 rounded-full bg-[#1e293b] animate-pulse"></div>
<div class="flex flex-col gap-2 flex-1">
<div class="h-4 w-1/2 bg-[#1e293b] rounded animate-pulse"></div>
<div class="h-3 w-1/4 bg-[#1e293b] rounded animate-pulse"></div>
</div>
<div class="h-8 w-16 rounded-lg bg-[#1e293b] animate-pulse shrink-0"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Skeleton -->
<nav class="absolute bottom-0 left-0 right-0 h-20 bg-[#111822] border-t border-[#1e293b] flex justify-around items-center px-6 pb-2 z-30">
<div class="flex flex-col items-center gap-1 opacity-50">
<div class="h-6 w-6 rounded bg-[#2b3b4f] animate-pulse"></div>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<div class="h-6 w-6 rounded bg-[#2b3b4f] animate-pulse"></div>
</div>
<!-- Active Tab Skeleton -->
<div class="flex flex-col items-center gap-1">
<div class="h-10 w-10 rounded-xl bg-[#2b7cee]/20 flex items-center justify-center">
<div class="h-6 w-6 rounded bg-[#2b7cee] animate-pulse"></div>
</div>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<div class="h-6 w-6 rounded bg-[#2b3b4f] animate-pulse"></div>
</div>
</nav>
<!-- Home Indicator Area -->
<div class="h-5 bg-background-dark w-full shrink-0"></div>
</div>
</body></html>
