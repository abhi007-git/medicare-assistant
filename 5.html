<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediCare Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101d22", 
                        "surface-dark": "#1a2c38",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem", 
                        "xl": "1.5rem", 
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen relative overflow-x-hidden pb-24 selection:bg-primary selection:text-white">
<!-- Header -->
<header class="flex items-center justify-between p-5 pt-8 sticky top-0 z-50 bg-[#101d22]/95 backdrop-blur-sm">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-3xl">local_hospital</span>
</div>
<h1 class="text-xl font-bold tracking-tight leading-tight">MediCare<br/><span class="text-primary font-normal">Assistant</span></h1>
</div>
<button aria-label="Settings" class="flex items-center justify-center size-12 rounded-full hover:bg-white/5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">settings</span>
</button>
</header>
<!-- Voice Command Indicator -->
<section class="px-5 py-2">
<div class="flex flex-col items-center justify-center gap-2 py-4">
<div class="animate-pulse bg-primary/20 rounded-full p-3 mb-1">
<span class="material-symbols-outlined text-primary text-3xl">mic</span>
</div>
<h2 class="text-2xl font-bold text-center leading-tight">Say "Help" for assistance</h2>
<p class="text-slate-400 text-sm font-medium">Listening...</p>
</div>
</section>
<!-- User Role Toggle -->
<section class="px-5 py-2">
<div class="flex h-14 w-full items-center justify-center rounded-[16px] bg-surface-dark p-1.5 border border-white/5">
<label class="relative z-10 flex cursor-pointer h-full flex-1 items-center justify-center rounded-[12px] transition-all has-[:checked]:bg-primary has-[:checked]:text-white has-[:checked]:shadow-lg text-slate-400 font-semibold text-base">
<span>Patient</span>
<input checked="" class="invisible w-0 absolute" name="role-toggle" type="radio" value="Patient"/>
</label>
<label class="relative z-10 flex cursor-pointer h-full flex-1 items-center justify-center rounded-[12px] transition-all has-[:checked]:bg-primary has-[:checked]:text-white has-[:checked]:shadow-lg text-slate-400 font-semibold text-base">
<span>Admin</span>
<input class="invisible w-0 absolute" name="role-toggle" type="radio" value="Admin"/>
</label>
</div>
</section>
<!-- Dashboard Grid -->
<section class="px-5 py-6">
<div class="grid grid-cols-2 gap-4">
<!-- Voice Form -->
<button class="group relative flex flex-col items-start justify-between h-44 p-5 rounded-[16px] bg-gradient-to-br from-blue-600 to-blue-800 shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-all border border-white/10 overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-8xl">graphic_eq</span>
</div>
<div class="size-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl">mic</span>
</div>
<div class="text-left z-10">
<h3 class="text-lg font-bold text-white leading-tight">Voice Form</h3>
<p class="text-blue-100 text-sm font-medium mt-1">Dictate symptoms</p>
</div>
</button>
<!-- Health Reader -->
<button class="group relative flex flex-col items-start justify-between h-44 p-5 rounded-[16px] bg-gradient-to-br from-emerald-600 to-emerald-800 shadow-lg shadow-emerald-900/20 active:scale-[0.98] transition-all border border-white/10 overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-8xl">document_scanner</span>
</div>
<div class="size-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl">document_scanner</span>
</div>
<div class="text-left z-10">
<h3 class="text-lg font-bold text-white leading-tight">Health Reader</h3>
<p class="text-emerald-100 text-sm font-medium mt-1">Scan Rx</p>
</div>
</button>
<!-- Navigation -->
<button class="group relative flex flex-col items-start justify-between h-44 p-5 rounded-[16px] bg-gradient-to-br from-purple-600 to-purple-800 shadow-lg shadow-purple-900/20 active:scale-[0.98] transition-all border border-white/10 overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-8xl">explore</span>
</div>
<div class="size-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl">near_me</span>
</div>
<div class="text-left z-10">
<h3 class="text-lg font-bold text-white leading-tight">Navigation</h3>
<p class="text-purple-100 text-sm font-medium mt-1">Find your ward</p>
</div>
</button>
<!-- Queue Status -->
<button class="group relative flex flex-col items-start justify-between h-44 p-5 rounded-[16px] bg-gradient-to-br from-orange-500 to-orange-700 shadow-lg shadow-orange-900/20 active:scale-[0.98] transition-all border border-white/10 overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-8xl">hourglass_top</span>
</div>
<div class="size-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl">confirmation_number</span>
</div>
<div class="text-left z-10">
<h3 class="text-lg font-bold text-white leading-tight">Queue Status</h3>
<p class="text-orange-100 text-sm font-medium mt-1">Token: #42</p>
</div>
</button>
</div>
</section>
<!-- Quick Stats Bar -->
<section class="px-5 pb-6">
<h3 class="text-slate-400 font-medium text-sm mb-3 uppercase tracking-wider pl-1">Live Hospital Stats</h3>
<div class="flex gap-4">
<div class="flex flex-1 flex-col justify-center rounded-[16px] bg-surface-dark border border-white/5 p-5">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-xl">groups</span>
<p class="text-slate-300 text-sm font-medium">Active Patients</p>
</div>
<p class="text-white text-3xl font-bold tracking-tight">124</p>
</div>
<div class="flex flex-1 flex-col justify-center rounded-[16px] bg-surface-dark border border-white/5 p-5">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-green-400 text-xl">notifications_active</span>
<p class="text-slate-300 text-sm font-medium">Now Serving</p>
</div>
<p class="text-white text-3xl font-bold tracking-tight">38</p>
</div>
</div>
</section>
<!-- Emergency FAB -->
<div class="fixed bottom-6 right-5 z-50">
<button aria-label="Emergency SOS" class="flex h-16 w-16 items-center justify-center rounded-2xl bg-red-600 shadow-[0_8px_20px_rgba(220,38,38,0.4)] text-white hover:bg-red-500 active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-red-500/30">
<span class="material-symbols-outlined text-4xl filled">e911_emergency</span>
</button>
</div>
</body></html>
