<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hospital Navigation</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1b2333", // Slightly lighter than background-dark for cards
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom Corner Animation for Scanner */
        .scanner-corner {
            position: absolute;
            width: 2rem;
            height: 2rem;
            border-color: #135bec;
            border-style: solid;
            transition: all 0.3s ease;
        }
        .scanner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 6px 0 0 0; }
        .scanner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 6px 0 0; }
        .scanner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 6px; }
        .scanner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 6px 0; }

        @keyframes pulse-border {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .scanner-frame {
            animation: pulse-border 2s infinite ease-in-out;
        }
        
        @keyframes radar-pulse {
            0% { box-shadow: 0 0 0 0 rgba(19, 91, 236, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(19, 91, 236, 0); }
            100% { box-shadow: 0 0 0 0 rgba(19, 91, 236, 0); }
        }
        .location-dot {
            animation: radar-pulse 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark">
<!-- Header Section -->
<header class="flex items-center p-4 gap-4 sticky top-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight flex-1">Wayfinding</h1>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>
</header>
<!-- Status Card -->
<div class="px-4 pb-4">
<div class="bg-surface-dark rounded-xl p-5 border border-white/5 shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="text-xs font-medium uppercase tracking-wider text-slate-400">Navigating to</span>
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-bold border border-emerald-500/20">
<span class="block size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        On Track
                    </span>
</div>
<h2 class="text-2xl font-bold leading-tight mb-1 text-white">Radiology - Room 305</h2>
<div class="flex items-center gap-2 text-slate-400 text-sm">
<span class="material-symbols-outlined text-lg">my_location</span>
<span>From: Ward C - Main Hall</span>
</div>
</div>
</div>
<!-- Scanner / Viewfinder Section -->
<div class="px-4 flex-1 flex flex-col min-h-[300px]">
<div class="relative w-full flex-1 rounded-2xl overflow-hidden shadow-lg bg-black isolate group">
<!-- Camera Feed Simulation -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-60" data-alt="Blurred perspective view of a modern hospital hallway with clean floors and lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDcAgbU_IKuVv4tX7NDUcce15L3Ljg1Nq76KuFO7IU0o037kuJ0sOFbjZScc4Tmr37oV0yUeuwbeBDu2ZOhN8uURiYU6ag98HoEQzjrVBC_e6srArMJvlP3GPPvcJVh_dvkEpI-1wFe37YnENgtNVKKEtbrnSuD5BEhboCazCU53O2EBpO_bKQZpZmEiwcYfkw-U21Dk_EZjlp9XLYMheT9jDmU40H2mRlKZLip2mUf6sKWVjUe77OdaVwCIOPjUyU8H2QTQRLdsUU');">
</div>
<!-- Dark Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 z-10"></div>
<!-- Scanner UI Elements -->
<div class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6">
<!-- Viewfinder Frame -->
<div class="scanner-frame relative w-64 h-64 flex items-center justify-center mb-6">
<div class="scanner-corner scanner-tl"></div>
<div class="scanner-corner scanner-tr"></div>
<div class="scanner-corner scanner-bl"></div>
<div class="scanner-corner scanner-br"></div>
<!-- Scanning Line Animation -->
<div class="absolute inset-x-0 h-0.5 bg-primary/50 top-0 animate-[scan_3s_ease-in-out_infinite]"></div>
<p class="mt-40 text-white/90 font-medium text-sm bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm">
                            Scan QR Code
                        </p>
</div>
<!-- Instruction Overlay Card (Floating) -->
<div class="absolute bottom-4 left-4 right-4 bg-surface-dark/95 backdrop-blur-md rounded-xl p-4 border border-white/10 shadow-xl flex items-center gap-4">
<button class="shrink-0 size-12 rounded-full bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">
<span class="material-symbols-outlined">volume_up</span>
</button>
<div class="flex-1 min-w-0">
<p class="text-white font-semibold text-lg leading-tight truncate">Turn left ahead</p>
<p class="text-slate-400 text-sm">At end of the hall</p>
</div>
<div class="shrink-0 flex flex-col items-end">
<span class="text-2xl font-bold text-white">50</span>
<span class="text-xs text-slate-400 font-medium uppercase">ft</span>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Controls & Map -->
<div class="p-4 space-y-5">
<!-- Progress Bar -->
<div class="space-y-2">
<div class="flex justify-between items-end text-sm">
<span class="text-slate-400 font-medium">Progress</span>
<span class="text-white font-bold">65%</span>
</div>
<div class="h-2 w-full bg-surface-dark rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full relative" style="width: 65%;">
<div class="absolute right-0 top-0 bottom-0 w-2 bg-white/20"></div>
</div>
</div>
</div>
<!-- Mini Map & Actions Layout -->
<div class="grid grid-cols-[1fr_auto] gap-4">
<!-- Mini Map -->
<div class="relative h-32 bg-surface-dark rounded-xl overflow-hidden border border-white/5">
<div class="absolute inset-0 bg-cover bg-center opacity-40" data-alt="Abstract blueprint map of a hospital floor layout" data-location="Hospital Floor 3 Map" style="background-image: url('https://placeholder.pics/svg/300'); filter: invert(1) hue-rotate(180deg) brightness(0.6);">
</div>
<!-- Map Overlay Paths (CSS Drawn) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none p-4" preserveaspectratio="none" viewbox="0 0 100 50">
<path class="drop-shadow-lg" d="M 10 25 L 40 25 L 40 10 L 80 10" fill="none" stroke="#135bec" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<!-- Start Dot -->
<circle cx="10" cy="25" fill="#3b82f6" r="3"></circle>
<!-- Current Pos -->
<circle class="location-dot" cx="40" cy="18" fill="#ffffff" r="4" stroke="#135bec" stroke-width="2"></circle>
<!-- End Pin -->
<circle cx="80" cy="10" fill="#22c55e" r="3"></circle>
</svg>
<div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded text-[10px] text-white font-mono">
                        LEVEL 3
                   </div>
</div>
<!-- Action Buttons (Vertical Stack) -->
<div class="flex flex-col gap-2 w-[140px]">
<button class="flex-1 flex flex-col items-center justify-center gap-1 bg-surface-dark hover:bg-surface-dark/80 active:scale-95 transition-all rounded-xl border border-primary/30 text-primary p-2">
<span class="material-symbols-outlined text-2xl">mic</span>
<span class="text-xs font-semibold">Set Destination</span>
</button>
<button class="h-10 flex items-center justify-center bg-red-500/10 hover:bg-red-500/20 active:bg-red-500/30 text-red-400 rounded-lg border border-red-500/20 transition-colors text-xs font-semibold px-4">
                        Reset
                    </button>
</div>
</div>
</div>
<!-- Bottom Safe Area Spacer -->
<div class="h-6 w-full"></div>
</div>
<style>
        @keyframes scan {
            0%, 100% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</body></html>
