<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Navigation Complete</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "surface-dark": "#192433",
                        "text-secondary": "#94a3b8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top Navigation -->
<header class="flex items-center justify-between p-4 sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">close</span>
</button>
<h1 class="text-base font-bold leading-tight tracking-tight">Navigation</h1>
<div class="size-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center px-6 pt-4 pb-8 w-full">
<!-- Hero Animation/Image -->
<div class="relative w-full max-w-[280px] aspect-square mb-8 flex items-center justify-center">
<!-- Abstract glow effect behind image -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full scale-75 animate-pulse"></div>
<div class="relative w-full h-full bg-contain bg-center bg-no-repeat z-10" data-alt="Abstract 3D illustration of a map location pin turning into a success checkmark with confetti" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDlIvpgahvf2llkH4iXBJr3Vjw-9tlDbeLDx1SdFRESZSvZq6B5Ut2odv0y28cuoQtc2i9N-WkTmAVTj-UsY4EAaK1YXRpoZHvAHnEVsBzgN5HX0LPOxBsiKj5Oe_KZwLj__TJhxdugDoYF3fyTpiAjNQnNJWv-kUHH7f5r2KMMUg1w-CGemynczWsu-uoBtQa6CpmgoLrUgxkEubzuD2783CHYc8k0S2f7wmVHpmmea-QKZlDOXMjMhu_57W-YtuiS-sXKzOLuVe8");'>
</div>
</div>
<!-- Success Message -->
<div class="flex flex-col items-center gap-3 mb-10 text-center animate-[fadeIn_0.5s_ease-out]">
<h2 class="text-2xl md:text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">
                    You have arrived!
                </h2>
<p class="text-slate-500 dark:text-text-secondary text-base font-normal leading-relaxed max-w-[280px]">
                    You are now at the Cardiology Waiting Area.
                </p>
</div>
<!-- Location Context Card -->
<div class="w-full mb-8">
<div class="group flex items-center justify-between gap-4 rounded-xl bg-white dark:bg-surface-dark p-4 shadow-sm border border-slate-200 dark:border-slate-800/50 hover:border-primary/50 transition-all duration-300">
<div class="flex flex-col gap-1.5 flex-[2]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">cardiology</span>
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight">Cardiology Dept.</p>
</div>
<p class="text-slate-500 dark:text-text-secondary text-sm font-normal pl-[28px]">Room 304, 3rd Floor</p>
</div>
<div class="h-16 w-20 shrink-0 bg-center bg-no-repeat bg-cover rounded-lg border border-slate-100 dark:border-white/10" data-alt="Small map snippet showing the hospital layout with a pin on Room 304" data-location="Hospital Interior Map" style='background-image: url("https://placeholder.pics/svg/300");'>
</div>
</div>
</div>
<!-- Spacer to push buttons to bottom if needed, though flex-col usually handles it -->
<div class="flex-1"></div>
</main>
<!-- Bottom Actions -->
<footer class="p-6 pt-2 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent">
<div class="flex flex-col gap-3 w-full">
<!-- Primary Action -->
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary hover:bg-blue-600 active:scale-[0.98] transition-all duration-200 text-white shadow-lg shadow-primary/25">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<span class="material-symbols-outlined mr-2 text-[20px]">check_circle</span>
<span class="text-base font-bold tracking-wide relative z-10">I'm here - Check me in</span>
</button>
<!-- Secondary Action -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-6 bg-transparent hover:bg-slate-200 dark:hover:bg-white/5 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors">
                    Back to Home
                </button>
</div>
</footer>
</div>
</body></html>
