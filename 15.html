<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Generic Error - Hospital Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom styles for smooth appearance */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center px-4 py-4 justify-between bg-transparent z-10">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-slate-900 dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">
                Status
            </h2>
</header>
<!-- Main Content (EmptyState Variant) -->
<main class="flex flex-1 flex-col items-center justify-center px-6 py-6 w-full max-w-md mx-auto">
<div class="flex flex-col items-center gap-8 w-full animate-in fade-in zoom-in duration-500">
<!-- Icon / Illustration Area -->
<div class="relative flex items-center justify-center">
<!-- Outer glow/circle -->
<div class="flex items-center justify-center w-32 h-32 rounded-full bg-primary/10 dark:bg-primary/20 backdrop-blur-sm">
<!-- Inner Icon -->
<span class="material-symbols-outlined text-primary" style="font-size: 64px; font-variation-settings: 'FILL' 0, 'wght' 300;">
                            wifi_off
                        </span>
</div>
<!-- Status Badge -->
<div class="absolute bottom-1 right-1 bg-background-light dark:bg-background-dark rounded-full p-1.5 border border-slate-200 dark:border-slate-800">
<span class="material-symbols-outlined text-red-500 block" style="font-size: 24px; font-variation-settings: 'FILL' 1;">
                            error
                        </span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 text-center">
<h1 class="text-2xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">
                        Something went wrong
                    </h1>
<p class="text-slate-500 dark:text-slate-400 text-base leading-relaxed max-w-[320px]">
                        We’re having trouble connecting to the hospital network. Please check your connection and try again.
                    </p>
</div>
<!-- Primary Action -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white text-base font-semibold leading-normal tracking-wide transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined mr-2" style="font-size: 20px;">refresh</span>
<span>Retry</span>
</button>
</div>
</main>
<!-- Footer / Secondary Action (SingleButton Variant) -->
<div class="flex px-4 py-8 justify-center pb-10">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-transparent text-primary dark:text-primary hover:text-blue-600 dark:hover:text-blue-400 text-sm font-semibold leading-normal tracking-[0.015em] transition-colors">
<span class="truncate">Contact Support</span>
</button>
</div>
</div>
</body></html>
