<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loading Screen - Hospital Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    animation: {
                        'spin-slow': 'spin 1.5s linear infinite',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom spinner animation for smoother feel */
        @keyframes spin-smooth {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin-smooth 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col items-center justify-between p-6">
<!-- Header / Logo Area -->
<div class="flex w-full justify-center pt-8 opacity-60">
<div class="flex items-center gap-2">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/20 text-primary">
<span class="material-symbols-outlined text-xl">local_hospital</span>
</div>
<span class="text-sm font-semibold tracking-wide text-slate-500 dark:text-slate-400 uppercase">MediQueue</span>
</div>
</div>
<!-- Main Content: Spinner & Text -->
<div class="flex flex-1 flex-col items-center justify-center gap-8 w-full max-w-sm">
<!-- Custom Spinner using SVG -->
<div class="relative flex items-center justify-center">
<!-- Background ring -->
<div class="h-16 w-16 rounded-full border-4 border-slate-200 dark:border-slate-800"></div>
<!-- Spinning ring -->
<div class="absolute h-16 w-16 rounded-full border-4 border-primary border-t-transparent spinner"></div>
<!-- Icon inside spinner -->
<div class="absolute text-primary">
<span class="material-symbols-outlined text-2xl">hourglass_empty</span>
</div>
</div>
<div class="flex flex-col items-center gap-3 text-center">
<h1 class="text-xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">
                    Retrieving your queue...
                </h1>
<p class="text-sm font-normal leading-relaxed text-slate-500 dark:text-slate-400 max-w-[280px]">
                    Please have your patient ID ready for verification once connected.
                </p>
</div>
<!-- Optional: Simulated progress skeleton or visual indicator of work -->
<div class="w-full max-w-[160px] h-1 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden mt-2">
<div class="h-full bg-primary w-1/3 animate-[pulse_2s_infinite] rounded-full"></div>
</div>
</div>
<!-- Footer: Meta Text -->
<div class="flex flex-col items-center gap-4 pb-8 w-full">
<!-- Helpful tip card -->
<div class="flex items-start gap-3 rounded-xl bg-slate-100 dark:bg-[#1a2634] p-4 w-full max-w-sm border border-slate-200 dark:border-slate-800/50">
<span class="material-symbols-outlined text-primary mt-0.5 text-lg">info</span>
<div class="flex flex-col gap-1">
<p class="text-xs font-semibold text-slate-900 dark:text-slate-200">Did you know?</p>
<p class="text-xs text-slate-500 dark:text-slate-400 leading-normal">
                        You can check live wait times for the pharmacy from the main dashboard after checking in.
                    </p>
</div>
</div>
<div class="mt-4 flex flex-col items-center gap-1">
<p class="text-slate-400 dark:text-[#92a9c9] text-xs font-medium text-center">Secure Connection</p>
<p class="text-slate-300 dark:text-[#586b85] text-[10px] font-normal text-center">Version 1.0.2</p>
</div>
</div>
</div>
</body></html>
