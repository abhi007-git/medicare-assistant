<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voice Form Filling</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                        "surface-dark": "#1c2427",
                        "surface-input": "#161b1d",
                        "border-inactive": "#3b4d54",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white overflow-x-hidden">
<div class="relative min-h-screen flex flex-col max-w-md mx-auto w-full shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between p-4 sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold tracking-tight">Voice Form</h2>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-5 pb-8">
<!-- Voice Hub / Status Section -->
<div class="flex flex-col items-center justify-center py-8">
<span class="text-primary text-sm font-medium tracking-wide bg-primary/10 px-3 py-1 rounded-full mb-4">Step 1 of 5</span>
<h1 class="text-3xl font-bold text-center leading-tight mb-8 text-slate-900 dark:text-white">
                    What is your <br/><span class="text-primary">full name?</span>
</h1>
<!-- Active Mic Button -->
<div class="relative group">
<!-- Static ripples for 'listening' effect -->
<div class="absolute inset-0 rounded-full bg-primary/20 scale-150 transform"></div>
<div class="absolute inset-0 rounded-full bg-primary/40 scale-125 transform"></div>
<button class="relative z-10 flex items-center justify-center w-20 h-20 bg-primary rounded-full shadow-[0_0_30px_rgba(19,182,236,0.6)] border-4 border-[#1c2427] dark:border-background-dark hover:scale-105 transition-transform duration-200">
<span class="material-symbols-outlined text-white text-4xl">mic</span>
</button>
</div>
<p class="mt-6 text-slate-500 dark:text-slate-400 text-sm font-medium">Listening...</p>
</div>
<!-- Form Fields List -->
<div class="flex flex-col gap-4 mt-2">
<!-- Active Field: Name -->
<div class="relative group transition-all duration-300">
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-1 h-12 bg-primary rounded-r-lg"></div>
<div class="bg-white dark:bg-surface-dark border-2 border-primary rounded-xl p-4 shadow-lg shadow-primary/5">
<label class="block text-primary text-xs font-bold uppercase tracking-wider mb-2">Name</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">person</span>
<input class="flex-1 bg-transparent border-none p-0 text-lg font-medium text-slate-900 dark:text-white placeholder-slate-400 focus:ring-0" placeholder="Say your name..." type="text" value="John Doe"/>
<span class="material-symbols-outlined text-primary animate-pulse">graphic_eq</span>
</div>
</div>
</div>
<!-- Inactive Field: Age -->
<div class="bg-slate-50 dark:bg-surface-input border border-slate-200 dark:border-border-inactive rounded-xl p-4 opacity-70 hover:opacity-100 transition-opacity">
<label class="block text-slate-400 dark:text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Age</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">calendar_today</span>
<div class="flex-1 text-lg font-medium text-slate-400 dark:text-slate-500">DD/MM/YYYY</div>
</div>
</div>
<!-- Inactive Field: Phone -->
<div class="bg-slate-50 dark:bg-surface-input border border-slate-200 dark:border-border-inactive rounded-xl p-4 opacity-70 hover:opacity-100 transition-opacity">
<label class="block text-slate-400 dark:text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Phone</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">phone</span>
<div class="flex-1 text-lg font-medium text-slate-400 dark:text-slate-500">Phone number</div>
</div>
</div>
<!-- Inactive Field: Address -->
<div class="bg-slate-50 dark:bg-surface-input border border-slate-200 dark:border-border-inactive rounded-xl p-4 opacity-70 hover:opacity-100 transition-opacity">
<label class="block text-slate-400 dark:text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Address</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">location_on</span>
<div class="flex-1 text-lg font-medium text-slate-400 dark:text-slate-500">Full address</div>
</div>
</div>
<!-- Inactive Field: Symptoms -->
<div class="bg-slate-50 dark:bg-surface-input border border-slate-200 dark:border-border-inactive rounded-xl p-4 opacity-70 hover:opacity-100 transition-opacity">
<label class="block text-slate-400 dark:text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Symptoms</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">medical_services</span>
<div class="flex-1 text-lg font-medium text-slate-400 dark:text-slate-500">Describe symptoms</div>
</div>
</div>
</div>
</main>
<!-- Bottom Actions & Help -->
<div class="sticky bottom-0 z-40 p-5 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent">
<!-- Voice Commands Help Card -->
<div class="mb-4 bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-inactive overflow-hidden shadow-lg">
<details class="group">
<summary class="flex items-center justify-between p-3 cursor-pointer list-none text-sm font-medium text-slate-600 dark:text-slate-300">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">info</span>
<span>Voice Commands Available</span>
</div>
<span class="material-symbols-outlined transition-transform group-open:rotate-180">expand_more</span>
</summary>
<div class="px-3 pb-3 pt-0 border-t border-slate-100 dark:border-slate-800">
<div class="grid grid-cols-2 gap-2 mt-3">
<div class="bg-slate-50 dark:bg-surface-input p-2 rounded text-center text-xs text-slate-500 dark:text-slate-400">"Next"</div>
<div class="bg-slate-50 dark:bg-surface-input p-2 rounded text-center text-xs text-slate-500 dark:text-slate-400">"Back"</div>
<div class="bg-slate-50 dark:bg-surface-input p-2 rounded text-center text-xs text-slate-500 dark:text-slate-400">"Clear"</div>
<div class="bg-slate-50 dark:bg-surface-input p-2 rounded text-center text-xs text-slate-500 dark:text-slate-400">"Stop"</div>
</div>
</div>
</details>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-sky-400 text-slate-900 font-bold py-4 rounded-xl text-lg shadow-lg shadow-primary/25 transition-colors flex items-center justify-center gap-2">
                    Confirm &amp; Next
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-slate-300 dark:border-border-inactive text-slate-500 dark:text-slate-400 font-medium py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-surface-dark transition-colors">
                    Reset Form
                </button>
</div>
</div>
</div>
</body></html>
