<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Added Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec37",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden font-display transition-colors duration-300">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-200 dark:border-white/10">
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Hospital Queue Manager</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-gray-900 dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0 hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">more_vert</span>
</button>
</div>
</div>
<!-- Main Content Area -->
<div class="flex flex-1 flex-col items-center justify-center px-4 py-8">
<div class="flex flex-col items-center gap-8 w-full max-w-md animate-fade-in">
<!-- Success Icon with Glow Effect -->
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl scale-150"></div>
<div class="relative flex h-32 w-32 items-center justify-center rounded-full bg-primary/10 border-2 border-primary">
<span class="material-symbols-outlined text-primary" style="font-size: 64px;">check_circle</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 text-center">
<h1 class="text-gray-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">Patient Added!</h1>
<div class="space-y-1">
<p class="text-gray-600 dark:text-gray-300 text-base font-normal leading-relaxed max-w-[320px]">
<span class="font-semibold text-gray-900 dark:text-white">James Doe (#4092)</span> has been successfully checked into Triage.
                        </p>
<p class="text-primary text-sm font-semibold tracking-wide uppercase pt-2">
                            Est. Wait: 15 mins
                        </p>
</div>
</div>
<!-- Patient Card Preview (Optional Context) -->
<div class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-xl p-4 flex items-center gap-4 shadow-sm">
<div class="h-12 w-12 rounded-full bg-gray-200 dark:bg-white/10 flex items-center justify-center overflow-hidden shrink-0">
<!-- Abstract avatar placeholder -->
<div class="w-full h-full bg-gradient-to-br from-gray-300 to-gray-400 dark:from-gray-700 dark:to-gray-600" data-alt="Abstract grey gradient representing user avatar"></div>
</div>
<div class="flex-1 min-w-0">
<p class="text-gray-900 dark:text-white font-bold truncate">James Doe</p>
<p class="text-gray-500 dark:text-gray-400 text-xs truncate">Symptoms: High Fever, Cough</p>
</div>
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500" style="font-size: 20px;">arrow_forward_ios</span>
</div>
</div>
</div>
<!-- Action Buttons Footer -->
<div class="mt-auto flex flex-col gap-3 px-4 pb-8 pt-4 w-full max-w-md mx-auto">
<!-- Primary Action -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-green-400 text-[#102213] text-lg font-bold leading-normal tracking-[0.015em] transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
<span class="material-symbols-outlined mr-2" style="font-size: 24px;">dashboard</span>
<span class="truncate">Go to Dashboard</span>
</button>
<!-- Secondary Action -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-transparent border-2 border-gray-300 dark:border-white/20 text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-white/5 text-lg font-semibold leading-normal tracking-[0.015em] transition-all active:scale-[0.98]">
<span class="material-symbols-outlined mr-2" style="font-size: 24px;">person_add</span>
<span class="truncate">Add Another Patient</span>
</button>
</div>
<!-- Bottom Spacer for Home Indicator on iOS -->
<div class="h-5 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
