<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Empty Queue State</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden mx-auto max-w-md shadow-xl border-x border-slate-200 dark:border-slate-800">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between z-10 sticky top-0 bg-background-light dark:bg-background-dark">
<div class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center">Queue Status</h2>
<div class="flex w-10 items-center justify-end">
<button class="flex items-center justify-center rounded-full size-10 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">settings</span>
</button>
</div>
</div>
<!-- Main Content (Scrollable) -->
<div class="flex-1 overflow-y-auto flex flex-col items-center justify-center p-6 pb-24">
<!-- Empty State -->
<div class="flex flex-col items-center gap-8 w-full animate-fade-in-up">
<!-- Illustration container with subtle primary glow -->
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 blur-[40px] rounded-full size-48 m-auto"></div>
<div class="relative bg-center bg-no-repeat bg-cover rounded-xl w-64 h-64 shadow-lg ring-1 ring-slate-200 dark:ring-slate-800" data-alt="Minimalist illustration of a calm waiting room or resting medical clipboard" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDoSCZ9IJbkza2xS7ShQOLQFnhIesgVOSFBqbWE4eqhg5GV6i9yIjD2Hres0B2t586t0ysTl1UcaDwrHx3IE8JYCoTix47uwjQTmwSMR9RUylDB35yyj2VcbSxY5hniOTqU2vO1udxYR3h6tNDZ38W6UEUqbEE9vFz3UwLhBELA0bDIinjSUb09X8sTsNPVc_WYCfRYAFCqzjLkbicJA335xbFDvi2pcc7S2pV--HaAW-pbcaasgWzZ9RT-HRgCxoJ453Ntqo7XW8U");'>
</div>
</div>
<div class="flex max-w-[320px] flex-col items-center gap-3 text-center">
<h3 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight tracking-tight">No patients in queue</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                        Great job! You are all caught up for now. The waiting list is currently empty.
                    </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 w-full max-w-[280px] mt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary hover:bg-blue-600 transition-colors text-white text-sm font-bold leading-normal tracking-wide shadow-lg shadow-primary/25 active:scale-95 duration-200">
<span class="mr-2 material-symbols-outlined text-[20px]">refresh</span>
<span class="truncate">Refresh Queue</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors text-slate-900 dark:text-white text-sm font-semibold leading-normal tracking-wide active:scale-95 duration-200">
<span class="mr-2 material-symbols-outlined text-[20px]">person_add</span>
<span class="truncate">Register Patient</span>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-background-light dark:bg-background-dark px-4 pb-6 pt-3 z-10">
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-1 group cursor-pointer" href="#">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" style="font-size: 24px; font-variation-settings: 'FILL' 1;">format_list_bulleted</span>
<p class="text-primary text-[10px] font-semibold leading-normal tracking-wide">Queue</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer" href="#">
<span class="material-symbols-outlined" style="font-size: 24px;">history</span>
<p class="text-[10px] font-medium leading-normal tracking-wide">History</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer" href="#">
<span class="material-symbols-outlined" style="font-size: 24px;">person</span>
<p class="text-[10px] font-medium leading-normal tracking-wide">Profile</p>
</a>
</div>
</div>
</body></html>
